# Builds the SDK, the generator and HelloMod (Homefront.slnx) and packs the HomefrontSDK NuGet package. A v* tag
# (v0.2.0) builds with that version, publishes the package to GitHub Packages (mods build against it) and makes a
# GitHub Release with HomefrontSDK-<tag>.zip (HomefrontSDK\, to extract into the server's Binaries folder).
name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Version from tag
      if: github.ref_type == 'tag'
      run: "\"VERSION_ARG=-p:Version=$($env:GITHUB_REF_NAME.TrimStart('v'))\" >> $env:GITHUB_ENV"
    - name: Build
      run: dotnet build Homefront.slnx -c Release -nologo $env:VERSION_ARG
    - name: Pack
      run: dotnet pack SDK/HomefrontSDK.csproj -c Release -nologo --no-build -o out $env:VERSION_ARG
    - name: Zip the install folder
      run: |
        New-Item -ItemType Directory -Force release/HomefrontSDK | Out-Null
        foreach ($f in 'dll', 'pdb', 'runtimeconfig.json', 'deps.json') { Copy-Item "SDK/bin/Release/net10.0/HomefrontSDK.$f" release/HomefrontSDK }
        Compress-Archive release/HomefrontSDK "out/HomefrontSDK-$env:GITHUB_REF_NAME.zip"
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: HomefrontSDK
        path: out/*
    - name: Publish to GitHub Packages
      if: github.ref_type == 'tag'
      run: dotnet nuget push (Get-ChildItem out/*.nupkg).FullName --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}"
    - name: GitHub Release
      if: github.ref_type == 'tag'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release create $env:GITHUB_REF_NAME (Get-ChildItem out/*.zip, out/*.nupkg).FullName --title "HomefrontSDK $env:GITHUB_REF_NAME" --generate-notes
